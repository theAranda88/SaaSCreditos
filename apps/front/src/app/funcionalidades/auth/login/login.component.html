<section class="login">
  <div class="tarjeta">
    <span class="badge">{{ 'auth.login.fase' | translate }}</span>
    <h1>{{ 'auth.login.titulo' | translate }}</h1>
    <p>{{ 'auth.login.subtitulo' | translate }}</p>

    <form [formGroup]="formulario" (ngSubmit)="enviar()">
      <label>
        {{ 'auth.login.correo' | translate }}
        <input type="email" formControlName="correo" autocomplete="email" />
      </label>

      <label>
        {{ 'auth.login.contrasena' | translate }}
        <input type="password" formControlName="contrasena" autocomplete="current-password" />
      </label>

      @if (error(); as claveError) {
        <p class="error">{{ claveError | translate }}</p>
      }

      <button type="submit" [disabled]="cargando() || formulario.invalid">
        {{ (cargando() ? 'auth.login.ingresando' : 'auth.login.ingresar') | translate }}
      </button>
    </form>
  </div>
</section>
