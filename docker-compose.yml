services:
  postgres:
    image: postgres:16-alpine
    container_name: creditos-postgres
    restart: unless-stopped
    env_file:
      - .env
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    ports:
      - "${POSTGRES_PORT:-5433}:5432"
    volumes:
      # Datos persistentes entre reinicios y rebuilds (no se pierde al recrear el contenedor)
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10

  db-init:
    build:
      context: .
      dockerfile: apps/backend/Dockerfile.db-init
    container_name: creditos-db-init
    env_file:
      - .env
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}?schema=public
    restart: "no"

  backend:
    build:
      context: .
      dockerfile: apps/backend/Dockerfile
    container_name: creditos-backend
    restart: unless-stopped
    env_file:
      - .env
    depends_on:
      postgres:
        condition: service_healthy
      db-init:
        condition: service_completed_successfully
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}?schema=public
      NODE_ENV: ${NODE_ENV}
      API_PORT: ${API_PORT}
      JWT_SECRETO: ${JWT_SECRETO}
    ports:
      - "${API_PORT:-3000}:3000"
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:3000/api/salud"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s

  front:
    build:
      context: .
      dockerfile: apps/front/Dockerfile
    container_name: creditos-front
    restart: unless-stopped
    env_file:
      - .env
    depends_on:
      backend:
        condition: service_healthy
    environment:
      API_URL: http://backend:3000
    ports:
      - "${FRONT_PORT:-4200}:80"

  test-e2e:
    profiles: [test]
    build:
      context: .
      dockerfile: apps/backend/Dockerfile.test-e2e
    env_file:
      - .env
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}?schema=public
      JWT_SECRETO: ${JWT_SECRETO:-secreto-dev-tests}
    depends_on:
      postgres:
        condition: service_healthy

volumes:
  postgres_data:
    name: creditos_postgres_data
