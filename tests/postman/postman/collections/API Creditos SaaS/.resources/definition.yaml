$kind: collection
description: |-
  Colección Postman del SaaS de gestión de créditos y cobro diario.

  **Contraseña de prueba (semilla):** ClaveSegura123

  **Entornos (importar uno o todos):**
  | Archivo | Cuándo usar |
  |---------|-------------|
  | `postman_environment.json` | Backend expuesto en localhost (Docker o host) |
  | `postman_environment.docker.json` | Stack Docker Compose (`docker compose up`) |
  | `postman_environment.production.json` | Plantilla para API en producción (editar URLs) |

  **Variables clave:** `base_url` (API con `/api`), `api_root` (host sin `/api`), `swagger_url`, `front_url`, `token`, `negocio_id`, `cliente_id`, `cobrador_id`, `credito_id`, `cuota_id`, `asignacion_id`.

  **Usuarios sembrados (Fase 1):**
  | Rol | Correo |
  |-----|--------|
  | propietario | ana@prueba-alfa.local |
  | cobrador | cobrador@prueba-alfa.local |
  | propietario | boris@prueba-beta.local |

  **Uso:**
  1. Importar la colección y el entorno que corresponda
  2. Seleccionar el entorno en Postman (esquina superior derecha)
  3. Ejecutar «Iniciar sesión» según el rol — guarda `token` y `negocio_id`
  4. Probar el resto de solicitudes

  **Flujo auth — verificación de aislamiento:**
  1. Propietario Alfa → login → `Obtener mi negocio`
  2. Propietario Beta → login → `Obtener negocio por ID` con `negocio_id` de Alfa → debe responder 403

  **Flujo clientes (RF-003):**
  1. Propietario Alfa → login → `Crear cliente` (guarda `cliente_id`)
  2. `Listar clientes` → debe incluir el creado
  3. Cobrador Alfa → login → `Crear cliente` → debe responder 403
  4. Propietario Beta → login → `Obtener cliente por ID` con `cliente_id` de Alfa → debe responder 404

  **Flujo cobradores (RF-004):**
  1. Propietario Alfa → login → `Crear cobrador` (guarda `cobrador_id`)
  2. `Listar cobradores` → solo rol cobrador del negocio
  3. Cobrador → login → `Crear cobrador` → debe responder 403
  4. Propietario Beta → `Obtener cobrador por ID` de Alfa → debe responder 404

  **Flujo créditos (RF-005 / RF-006):**
  1. Propietario Alfa → login → `Crear cliente` → `Crear credito` (guarda `credito_id`)
  2. `Consultar plan de cuotas` → N cuotas = `numero_cuotas`
  3. Cobrador → `Crear credito` → 403
  4. Propietario Beta → `Obtener credito por ID` de Alfa → 404

  **Flujo asignación de cartera (RF-007):**
  1. Propietario Alfa → `Crear cobrador` + `Crear credito` → `Asignar cartera` (guarda `asignacion_id`)
  2. Reenviar `Asignar cartera` con otro cobrador → cierra la previa y deja una sola `activa`
  3. Cobrador Alfa → `Listar asignaciones` → solo las suyas activas
  4. Cobrador → `Asignar cartera` → 403
  5. Propietario Beta → `Obtener asignacion por ID` de Alfa → 404
