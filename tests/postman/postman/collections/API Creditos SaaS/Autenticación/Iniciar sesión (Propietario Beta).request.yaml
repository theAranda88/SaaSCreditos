$kind: http-request
description: "Negocio: Créditos Beta (prueba). Útil para probar aislamiento entre tenants."
url: "{{base_url}}/auth/login"
method: POST
headers:
  Content-Type: application/json
body:
  type: text
  content: |-
    {
      "correo": "boris@prueba-beta.local",
      "contrasena": "ClaveSegura123"
    }
scripts:
  - type: afterResponse
    code: |-
      if (pm.response.code === 200) {
        const json = pm.response.json();
        pm.environment.set('token', json.token);
        if (json.usuario && json.usuario.negocio_id) {
          pm.environment.set('negocio_id', json.usuario.negocio_id);
        }
      }
    language: text/javascript
order: 2000
