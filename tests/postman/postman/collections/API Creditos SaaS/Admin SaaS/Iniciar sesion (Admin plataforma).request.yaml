$kind: http-request
description: Usuario sembrado admin@plataforma.local / ClaveSegura123. Guarda token_plataforma.
url: "{{base_url}}/auth/login"
method: POST
headers:
  Content-Type: application/json
body:
  type: text
  content: |-
    {
      "correo": "admin@plataforma.local",
      "contrasena": "ClaveSegura123"
    }
scripts:
  - type: afterResponse
    code: |-
      if (pm.response.code === 200) {
        const json = pm.response.json();
        pm.environment.set('token', json.token);
        pm.environment.set('token_plataforma', json.token);
      }
    language: text/javascript
order: 500
