$kind: http-request
description: Transacción atómica. No cobra en domingos ni festivos. Monto <= saldo_pendiente.
url: "{{base_url}}/pagos"
method: POST
headers:
  Content-Type: application/json
  Authorization: Bearer {{token}}
body:
  type: text
  content: |-
    {
      "cuotaId": "{{cuota_id}}",
      "monto": 6000,
      "metodoPago": "efectivo",
      "fechaPago": "2026-09-21T15:00:00.000Z"
    }
scripts:
  - type: afterResponse
    code: |-
      if (pm.response.code === 201) {
        const json = pm.response.json();
        pm.environment.set('pago_id', json.id);
      }
    language: text/javascript
order: 2000
